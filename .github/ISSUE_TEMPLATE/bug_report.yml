name: 🐛 Bug Report
description: Report something that isn't working as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below as clearly as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run '...'
        2. Launch '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include logs, stack traces, or screenshots if possible.
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Swarmbox is affected?
      multiple: true
      options:
        - PX4-Autopilot / autopilot setup
        - swarmbox_ws (ROS 2 workspace)
        - Simulation (Gazebo/SITL)
        - Networking / Swarm communication
        - Scripts (setup, cleanup, tmux)
        - Documentation
        - Other
    validations:
      required: false

  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, ROS 2 distro, PX4 version/commit, hardware (SITL/real drone), etc.
      placeholder: e.g. Ubuntu 22.04, ROS 2 Humble, PX4 v1.14, SITL
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else that could help diagnose the issue.
    validations:
      required: false
